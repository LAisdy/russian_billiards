# pyramid-web frontend — static Three.js app + reverse proxy to the backend.
# Mounted as /etc/nginx/conf.d/default.conf inside the frontend container
# (see docker/frontend.Dockerfile). "backend" resolves via docker-compose DNS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for static assets and JSON API payloads (the Step 7
    # profiling showed keyframe-heavy shot_result payloads compress 6-12x;
    # gzip here gives the same win on the REST path). WebSocket frames are
    # unaffected — the upgrade path bypasses gzip, and permessage-deflate is
    # negotiated end-to-end between browser and uvicorn.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json
               application/wasm image/svg+xml;
    gzip_vary on;

    # REST API -> FastAPI backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint (lobby / game channels; Step 2+).
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Idle game sockets must survive long thinking pauses between shots.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vendored libraries rarely change — cache for a day.
    location /vendor/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # First-party files: revalidate on every load so frontend updates
    # propagate immediately after a container rebuild.
    location ~* ^/(main|lobby|ui_math)\.js$ {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
